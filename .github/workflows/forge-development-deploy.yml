name: Forge Development Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-development]')
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      DEPLOY_SITE: retailinmotion.atlassian.net
      DEPLOY_PRODUCT: jira
      DEPLOY_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Forge credentials
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL secret" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
      - name: Install dependencies and Forge CLI
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
      - name: Run tests
        run: npm test
      - name: Build Custom UI
        run: npm run build:ui
      - name: Deploy Forge app to development
        run: forge deploy --environment development --non-interactive --approve MAJOR_VERSION_RULE
      - name: Install or upgrade Jira development installation
        shell: bash
        run: |
          set +e
          forge install --upgrade --site "$DEPLOY_SITE" --product "$DEPLOY_PRODUCT" --environment "$DEPLOY_ENVIRONMENT" --confirm-scopes --non-interactive 2>&1 | tee forge-install.log
          install_status=${PIPESTATUS[0]}
          set -e

          if [ "$install_status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "Could not find an installation for the provided Atlassian app" forge-install.log; then
            echo "No existing development installation found; attempting first installation."
            forge install --site "$DEPLOY_SITE" --product "$DEPLOY_PRODUCT" --environment "$DEPLOY_ENVIRONMENT" --confirm-scopes --non-interactive
            exit 0
          fi

          echo "Development installation upgrade failed."
          exit "$install_status"
      - name: Record deployed commit
        run: echo "Deployed commit $GITHUB_SHA to development on $DEPLOY_SITE"

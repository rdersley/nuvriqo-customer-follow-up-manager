name: Worksite Deploy Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/worksite-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: nuvriqo-sandbox
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Forge credentials
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL secret" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN secret" && exit 1)
      - name: Install dependencies and Forge CLI
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
      - name: Run tests
        run: npm test
      - name: Build Custom UI resources
        run: npm run build:ui
      - name: Deploy development app
        run: forge deploy --environment development --non-interactive --approve MAJOR_VERSION_RULE
      - name: Upgrade worksite installation
        shell: bash
        run: |
          set +e
          forge install --upgrade --site "retailinmotion.atlassian.net" --product jira --environment development --confirm-scopes --non-interactive 2>&1 | tee forge-install.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          if grep -q "Could not find an installation for the provided Atlassian app" forge-install.log; then
            forge install --site "retailinmotion.atlassian.net" --product jira --environment development --confirm-scopes --non-interactive
            exit 0
          fi
          exit "$status"

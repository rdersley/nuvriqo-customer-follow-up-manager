app:
  id: ari:cloud:ecosystem::app/6182f3aa-7389-4d0a-b353-d0b60b74c8f8
  licensing:
    enabled: true
  runtime:
    name: nodejs22.x

modules:
  jira:projectSettingsPage:
    - key: nuvriqo-settings
      resource: admin-ui
      resolver:
        function: ui-resolver
      title: Nuvriqo Follow-Up Manager
      layout: blank

  jira:issuePanel:
    - key: nuvriqo-issue-panel
      resource: issue-panel-ui
      resolver:
        function: ui-resolver
      title: Nuvriqo Follow-Up
      icon: resource:issue-panel-ui;icons/followup.svg
      viewportSize: medium

  trigger:
    - key: nuvriqo-issue-upd
      function: issue-handler
      events:
        - avi:jira:updated:issue
      filter:
        appIsLicensed: true
    - key: nuvriqo-comment
      function: comment-handler
      events:
        - avi:jira:commented:issue
      filter:
        appIsLicensed: true

  scheduledTrigger:
    - key: nuvriqo-hourly
      function: followup-processor
      interval: hour
      filter:
        appIsLicensed: true
    - key: nuvriqo-privacy
      function: privacy-handler
      interval: week

  function:
    - key: issue-handler
      handler: index.onIssueUpdated
    - key: comment-handler
      handler: index.onCommentCreated
    - key: followup-processor
      handler: index.processDueFollowUps
      timeoutSeconds: 900
    - key: privacy-handler
      handler: privacy.processPrivacy
    - key: ui-resolver
      handler: ui-resolver.handler

resources:
  - key: admin-ui
    path: static/admin/dist
  - key: issue-panel-ui
    path: static/issue-panel/dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - write:servicedesk-request
    - storage:app
    - report:personal-data
